<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" preserveAspectRatio="xMidYMid meet">
  <!-- Define gradients for warm glow -->
  <defs>
    <radialGradient id="bulbGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD699;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#FFB340;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bulbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE5A3;stop-opacity:0.7"/>
      <stop offset="70%" style="stop-color:#FFD166;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#FFC857;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="bulbGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF5CC;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#FFE4B5;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#FFD580;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Glow circles -->
  <circle cx="100" cy="80" r="32" fill="url(#bulbGlow1)"/>
  <circle cx="250" cy="40" r="28" fill="url(#bulbGlow2)"/>
  <circle cx="400" cy="70" r="30" fill="url(#bulbGlow3)"/>
  <circle cx="550" cy="50" r="26" fill="url(#bulbGlow1)"/>
  <circle cx="700" cy="75" r="29" fill="url(#bulbGlow2)"/>
  <circle cx="850" cy="55" r="27" fill="url(#bulbGlow3)"/>

  <!-- Wire connecting bulbs -->
  <path d="M 80 50 Q 150 30, 220 60 T 370 80 T 520 60 T 670 85 T 820 70 T 920 80" 
        stroke="#3D3D3D" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Bulb shapes and hooks -->
  <!-- Bulb 1 -->
  <rect x="88" y="65" width="24" height="6" rx="2" fill="#8B7355" opacity="0.8"/>
  <path d="M 96 65 Q 92 55, 100 40" stroke="#8B7355" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="100" cy="85" r="10" fill="#FFD699" opacity="0.9"/>
  <circle cx="100" cy="85" r="9" fill="none" stroke="#FFA500" stroke-width="0.5" opacity="0.6"/>

  <!-- Bulb 2 -->
  <rect x="238" y="25" width="24" height="6" rx="2" fill="#8B7355" opacity="0.8"/>
  <path d="M 246 25 Q 242 15, 250 0" stroke="#8B7355" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="250" cy="45" r="9" fill="#FFE5A3" opacity="0.9"/>
  <circle cx="250" cy="45" r="8" fill="none" stroke="#FFD166" stroke-width="0.5" opacity="0.6"/>

  <!-- Bulb 3 -->
  <rect x="388" y="55" width="24" height="6" rx="2" fill="#8B7355" opacity="0.8"/>
  <path d="M 396 55 Q 392 40, 400 20" stroke="#8B7355" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="400" cy="75" r="10" fill="#FFF5CC" opacity="0.9"/>
  <circle cx="400" cy="75" r="9" fill="none" stroke="#FFE4B5" stroke-width="0.5" opacity="0.6"/>

  <!-- Bulb 4 -->
  <rect x="538" y="35" width="24" height="6" rx="2" fill="#8B7355" opacity="0.8"/>
  <path d="M 546 35 Q 542 22, 550 5" stroke="#8B7355" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="550" cy="55" r="8" fill="#FFD699" opacity="0.9"/>
  <circle cx="550" cy="55" r="7" fill="none" stroke="#FFA500" stroke-width="0.5" opacity="0.6"/>

  <!-- Bulb 5 -->
  <rect x="688" y="60" width="24" height="6" rx="2" fill="#8B7355" opacity="0.8"/>
  <path d="M 696 60 Q 692 48, 700 30" stroke="#8B7355" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="700" cy="80" r="9" fill="#FFE5A3" opacity="0.9"/>
  <circle cx="700" cy="80" r="8" fill="none" stroke="#FFD166" stroke-width="0.5" opacity="0.6"/>

  <!-- Bulb 6 -->
  <rect x="838" y="40" width="24" height="6" rx="2" fill="#8B7355" opacity="0.8"/>
  <path d="M 846 40 Q 842 28, 850 10" stroke="#8B7355" stroke-width="1.5" fill="none" opacity="0.7"/>
  <circle cx="850" cy="60" r="9" fill="#FFF5CC" opacity="0.9"/>
  <circle cx="850" cy="60" r="8" fill="none" stroke="#FFE4B5" stroke-width="0.5" opacity="0.6"/>
</svg>